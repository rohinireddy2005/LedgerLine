
spring.application.name=ledgerline

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}

spring.datasource.username=${DB_USERNAME:ledgerline_app}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-minutes=15

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.springframework.data.web.config=ERROR
