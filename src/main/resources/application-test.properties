spring.application.name=ledgerline-test

server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline_test_db
spring.datasource.username=ledgerline_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=15
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.springframework.data.web.config=ERROR